<!DOCTYPE html>
<html lang="hr">
<head>
 <meta charset="UTF-8" />
 <title>JS osnove</title>
</head>
<body>
 <script type="text/javascript">
    let granica = 200;
    let i = 0;
    let zbroj = 0
    while(++i <= granica)
        zbroj += i;
    let prosjek = zbroj / granica;
    document.write(prosjek);
 </script>
</body>
</html>
