<!DOCTYPE html>
<html lang="hr">

 <meta charset="UTF-8" />
 <title>JS osnove</title>
</head>
<body>
 <script type="text/javascript">
    let granica = 200;
    let i = 0;
    while(++i <= granica)
        if(i % 2 == 0)
            document.write(i + " " + i*i + "<br/>");
 </script>
